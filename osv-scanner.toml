# OSV-Scanner ignore list — triaged CVE backlog (#403).
#
# Every entry here is a vulnerability that CANNOT be fixed by a dependency bump
# right now, with a documented reason and (where a fix may land) a review date.
# The full OSV scan is BLOCKING again (see .github/workflows/osv-scanner.yml), so
# any NEW vulnerability that is not listed here fails the build. Re-run
# `osv-scanner scan --lockfile uv.lock` after any dependency change and prune
# entries whose fix has become reachable.

# --- Pillow image parsing (stable Arcade pin blocks Pillow 12.x) -----------------
# The active application has no image-upload route. Two archived offline YOLO
# augmentation modules call Image.open on files in a local dataset directory.
# Those scripts are not part of the application path and must not be run on
# untrusted image archives. Arcade 3.3.3 pins pillow>=11.3.0,<11.4, while the
# fixed Pillow releases require 12.x. Revisit before using those scripts on
# external data and when a stable Arcade release supports Pillow 12.x.
[[IgnoredVulns]]
id = "GHSA-wjx4-4jcj-g98j"
ignoreUntil = 2026-11-10T00:00:00Z
reason = "Pillow 12.x fixes are blocked by arcade==3.3.3 (<11.4). The active app has no image-upload route; archived offline augmentation scripts read local dataset files and must not process untrusted image archives. Recheck when stable Arcade supports Pillow 12.x or before external image input is added."

