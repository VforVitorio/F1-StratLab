# --- torch (no upstream fix) --------------------------------------------------
# GHSA-rrmf-rvhw-rf47 has no fixed version. torch is CUDA-pinned (cu128) for the
# training/dev box; the flaw needs an attacker-controlled model/input executed
# in-process, which a single-user local tool does not expose.
[[IgnoredVulns]]
id = "GHSA-rrmf-rvhw-rf47"
reason = "torch: no upstream fix; CUDA-pinned; requires attacker-controlled in-process model input, outside the single-user local threat model."

# --- ecdsa: waiver removed, the dependency is gone ----------------------------
# GHSA-wj6h-64fc-37mp was waived here on the grounds that ecdsa arrived
# transitively through python-jose and was never exercised, since the backend
# authenticates with a static API key rather than JWT. That reasoning was the
# argument for deleting the dependency, not for tolerating it: nothing in the
# codebase imported python-jose at all. Dropping it took ecdsa, rsa and pyasn1
# out of the lock with it, so there is no longer a vulnerability to ignore.

# --- setuptools (fixed release blocked by CUDA-pinned Torch) -------------------
# Torch 2.11.0+cu128 requires setuptools<82, so the fixed 83.0.0 cannot resolve
# without changing the CUDA-pinned Torch stack. The advisory affects sdist builds
# on macOS APFS/HFS+ using MANIFEST.in exclude/prune rules. This repository has no
# MANIFEST.in, and release builds run on Ubuntu. Revisit if packaging inputs or
# supported build platforms change, or when a compatible Torch release lifts the cap.
[[IgnoredVulns]]
id = "PYSEC-2026-3447"
ignoreUntil = 2026-11-10T00:00:00Z
reason = "Setuptools 83.0.0 is blocked by torch 2.11.0+cu128 requiring setuptools<82. The flaw affects macOS APFS/HFS+ sdist builds using MANIFEST.in exclude/prune rules; this repository has no MANIFEST.in and release builds run on Ubuntu. Recheck if build inputs/platforms change or compatible Torch lifts the cap."

# --- nltk: waiver removed, the dependency is gone -----------------------------
# GHSA-8mgp-746c-j5xp (CVE-2026-81726) had nothing to bump to: last_affected
# 3.10.3, no fix event, and 3.10.3 is the newest release. Nothing under src/,
