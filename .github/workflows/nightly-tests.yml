name: Nightly tests

on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-tests
  cancel-in-progress: true

jobs:
  full-suite:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run full suite
        run: uv run pytest -v -n 4 --dist=loadfile --cov=src --cov-report=term-missing
